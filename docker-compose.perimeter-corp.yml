services:
  api:
    image: bsstimecollection-api:arganda-external-admin-auth
    build:
      context: /opt/BSSTimeCollection/.worktrees/arganda-deploy/backend
      dockerfile: Dockerfile.corp-offline
    environment:
      PERIMETER_SQLSERVER_CREDENTIALS_FILE: /run/secrets/perimeter_sqlserver.json
    volumes:
      - /opt/BSSTimeCollection/sql/perimeter_sqlserver.json:/run/secrets/perimeter_sqlserver.json:ro
  worker:
    image: bsstimecollection-api:admin-auth-ba7923d
    build:
      dockerfile: Dockerfile.corp-offline
  web:
    image: bsstimecollection-web:arganda-external-admin-auth
    build:
      context: /opt/BSSTimeCollection/.worktrees/arganda-deploy/frontend
      dockerfile: Dockerfile.corp-offline
