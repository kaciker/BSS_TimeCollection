name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config >/dev/null
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for application
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=120
          exit 1
      - name: Smoke test terminal provisioning and event flow
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/admin/terminals/DEMO-01/provision | python3 -c 'import json,sys; print(json.load(sys.stdin)["activation_token"])')
          curl -fsS -c /tmp/bss-cookies.txt -H 'Content-Type: application/json' \
            -d "{\"token\":\"${TOKEN}\"}" \
            http://127.0.0.1:8080/api/v1/terminal/activate | grep -q 'DEMO-01'
          curl -fsS -b /tmp/bss-cookies.txt http://127.0.0.1:8080/api/v1/terminal/config | grep -q 'DEMO-01'
          curl -fsS -b /tmp/bss-cookies.txt -H 'Content-Type: application/json' \
            -d '{"reporter_id":"CI-900001","identification_method":"KEYPAD"}' \
            http://127.0.0.1:8080/api/v1/terminal/scan | grep -q 'ENTRY_RECORDED'
          curl -fsS -b /tmp/bss-cookies.txt -H 'Content-Type: application/json' \
            -d '{"reporter_id":"CI-900001","identification_method":"KEYPAD"}' \
            http://127.0.0.1:8080/api/v1/terminal/scan | grep -q 'EXIT_REQUIRED'
          curl -fsS -b /tmp/bss-cookies.txt -H 'Content-Type: application/json' \
            -d '{"reporter_id":"CI-900001","identification_method":"KEYPAD","action_code":"END_WORK"}' \
            http://127.0.0.1:8080/api/v1/terminal/exit | grep -q 'EXIT_RECORDED'
          curl -fsS 'http://127.0.0.1:8080/api/v1/admin/monitoring/events?reporter_id=CI-900001' | grep -q 'CI-900001'
      - name: Show stack status
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
