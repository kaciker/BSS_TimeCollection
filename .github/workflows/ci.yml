name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config >/dev/null
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for application
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=120
          exit 1
      - name: Smoke test public health and fail-closed Admin
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null
          status=$(curl -sS -o /tmp/bss-admin-response.txt -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/admin/monitoring/events)
          test "$status" = "503"
          status=$(curl -sS -o /tmp/bss-admin-invalid-response.txt -w '%{http_code}' \
            -H 'Authorization: Bearer invalid-ci-token' \
            http://127.0.0.1:8080/api/v1/admin/monitoring/events)
          test "$status" = "503"
          echo "Admin fails closed without configured provider"
      - name: Show stack status
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
